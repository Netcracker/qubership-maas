name: APM Packages Auto-Update
run-name: "APM update #${{ github.run_number }} — triggered by ${{ github.actor }} (${{ github.event_name }})"

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run APM update in dry-run mode and skip pull request creation"
        type: boolean
        default: false
      auto-merge:
        description: "Automatically enable auto-merge for the created pull request"
        type: boolean
        default: true
  schedule:
    - cron: "0 6 * * 1"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ secrets.APM_UPDATE_TOKEN }}
          persist-credentials: false

      - name: Update APM packages
        uses: netcracker/qubership-workflow-hub/actions/apm-packages-update@288a6a0d9a78e80dfdefccab1be6497a39deb746 # v2.8.0
        with:
          dry-run: ${{ inputs.dry-run || 'false' }}
          auto-merge: ${{ inputs.auto-merge || 'true' }}
          token: ${{ secrets.APM_UPDATE_TOKEN }} # PAT with `repo` scope
