name: '[MaaS] Go build' # zizmor: ignore[excessive-permissions]

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'maas/**'
      - 'maas-integration-tests/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'maas/**'
      - 'maas-integration-tests/**'

jobs:
  build: # zizmor: ignore[excessive-permissions]
    uses: netcracker/qubership-core-infra/.github/workflows/generic-go-build.yaml@8a233b03c5b5355d59c1585ffdaa1f45ea816405 # v2.6.1
    with:
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
      go-module-dir: maas/maas-service
      skip-docker: true
    secrets: inherit # zizmor: ignore[secrets-inherit]

  integration-tests: # zizmor: ignore[excessive-permissions]
    uses: netcracker/qubership-core-infra/.github/workflows/generic-maven-build.yaml@8a233b03c5b5355d59c1585ffdaa1f45ea816405 # v2.6.1
    with:
      maven-command: ${{ github.event_name == 'pull_request' && 'verify' || 'deploy' }}
      skip-docker: true
    secrets: inherit # zizmor: ignore[secrets-inherit]

  docker-build: # zizmor: ignore[excessive-permissions]
    needs: [build, integration-tests]
    uses: netcracker/qubership-core-infra/.github/workflows/docker-build.yaml@8a233b03c5b5355d59c1585ffdaa1f45ea816405 # v2.6.1
    with:
      dry-run: false
      config-filename: "maas---docker-dev-config.json"
