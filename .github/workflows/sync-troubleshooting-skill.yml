name: Sync Troubleshooting Skill
run-name: "Sync troubleshooting skill #${{ github.run_number }} — triggered by ${{ github.actor }} (${{ github.event_name }})"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      auto-merge:
        description: "Automatically enable auto-merge for the created pull request"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync troubleshooting doc into skill
        uses: netcracker/qubership-workflow-hub/actions/sync-files-action@27fd7674286e5f561a6fd8277f2f389ff96ddb9e # v2.6.0
        with:
          files: |
            [
              { "from": "docs/troubleshooting.md", "to": "agent-packages/troubleshoot-maas/.apm/skills/troubleshoot-maas/references/troubleshooting.md" }
            ]
          title: "chore: sync troubleshooting skill reference"
          commit-message: "chore: sync troubleshooting skill reference"
          auto-merge: ${{ inputs.auto-merge || 'true' }}
          token: ${{ secrets.GITHUB_TOKEN }}
