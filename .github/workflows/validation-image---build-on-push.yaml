name: '[MaaS validation image] Go build'

permissions:
  contents: read
  packages: write

on:
  push:
    paths:
      - 'validation-image/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'validation-image/**'

jobs:
  docker-build:
    uses: netcracker/qubership-core-infra/.github/workflows/docker-build.yaml@91f0316488bc6ab88d060261caa1ebddd6706094 # v2.7.0
    with:
      dry-run: false
      config-filename: "validation-image---docker-dev-config.json"
