name: '[MaaS validation image] Go build'

permissions:
  contents: read
  packages: write

on:
  push:
    paths:
      - 'validation-image/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'validation-image/**'

jobs:
  docker-build:
    uses: netcracker/qubership-core-infra/.github/workflows/docker-build.yaml@8a233b03c5b5355d59c1585ffdaa1f45ea816405 # v2.6.1
    with:
      dry-run: false
      config-filename: "validation-image---docker-dev-config.json"
