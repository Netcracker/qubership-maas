name: '[MaaS validation image] Go build'

permissions:
  contents: read
  packages: write

on:
  push:
    paths:
      - 'validation-image/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'validation-image/**'

jobs:
  docker-build:
    uses: netcracker/qubership-core-infra/.github/workflows/docker-build.yaml@e8322e6ee168795edec1d103e289b3fe3ceb805d # v2.6.0
    with:
      dry-run: false
      config-filename: "validation-image---docker-dev-config.json"
