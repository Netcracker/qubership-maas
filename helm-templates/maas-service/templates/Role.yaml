{{- if .Values.OPERATOR_ENABLED }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: '{{ .Values.SERVICE_NAME }}-operator'
  namespace: '{{ .Values.NAMESPACE }}'
  labels:
    app.kubernetes.io/instance: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID | default "unimplemented" }}'
rules:
  # Leader election: Lease maas-operator-leader in the MaaS namespace.
  - apiGroups: [ coordination.k8s.io ]
    resources: [ leases ]
    verbs: [ get, list, watch, create, update, patch, delete ]
{{- end }}
